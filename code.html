<script data-purpose="rain-canvas-engine">
    (function () {
      const canvas = document.getElementById('rain-canvas');
      if (!canvas) return;

      const ctx = canvas.getContext('2d');
      let width = (canvas.width = window.innerWidth);
      let height = (canvas.height = window.innerHeight);

      // Raindrop system
      const dropCount = Math.floor(Math.min(width, 1400) * 0.12);
      const drops = [];

      for (let i = 0; i < dropCount; i++) {
        drops.push({
          x: Math.random() * width,
          y: Math.random() * height,
          length: Math.random() * 16 + 12,
          speed: Math.random() * 9 + 11,
          opacity: Math.random() * 0.28 + 0.12,
          slant: -1.2
        });
      }

      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);

      function renderRain() {
        ctx.clearRect(0, 0, width, height);

        ctx.strokeStyle = 'rgba(215, 230, 245, 0.4)';
        ctx.lineWidth = 1;
        ctx.lineCap = 'round';

        for (let i = 0; i < drops.length; i++) {
          const d = drops[i];
          ctx.strokeStyle = `rgba(205, 222, 240, ${d.opacity})`;
          ctx.beginPath();
          ctx.moveTo(d.x, d.y);
          ctx.lineTo(d.x + d.slant * 4, d.y + d.length);
          ctx.stroke();

          // Motion update
          d.y += d.speed;
          d.x += d.slant;

          // Recycle drop when out of screen bounds
          if (d.y > height + 20) {
            d.y = -20;
            d.x = Math.random() * (width + 100) - 50;
          }
        }

        requestAnimationFrame(renderRain);
      }

      requestAnimationFrame(renderRain);
    })();
  </script>
<!-- END: Rain Ambient Particle Simulation -->
